name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    name: release a new version
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: decide
        id: decide
        run: .github/version.sh release

      - name: check out the tag to resume from
        if: steps.decide.outputs.release == 'resume'
        env:
          COMMIT: ${{ steps.decide.outputs.commit }}
        run: git checkout --detach "$COMMIT"

      - name: toolchain
        if: steps.decide.outputs.release != 'no'
        run: |
          rustup toolchain install
          rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: build
        if: steps.decide.outputs.release != 'no'
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: archives
        if: steps.decide.outputs.release != 'no'
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            .github/package.sh "$target" "target/$target/release/cornercase-notch" dist
            tar -tzf "dist/cornercase-notch-$target.tar.gz"
          done

      - name: publish
        if: steps.decide.outputs.release != 'no'
        env:
          MODE: ${{ steps.decide.outputs.release }}
        run: .github/publish.sh "$MODE"
